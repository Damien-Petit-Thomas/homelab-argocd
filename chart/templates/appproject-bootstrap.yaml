{{- $p := .Values.bootstrapProject }}
{{- include "homelab-argocd.requireList" (dict "value" $p.sourceRepos "path" "bootstrapProject.sourceRepos") }}
# Scope of the root Application: ArgoCD's own configuration objects only.
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: {{ $p.name }}
  namespace: {{ .Values.argocdNamespace }}
  annotations:
    # Deleting a project orphans its Applications: never pruned nor deleted.
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  description: {{ $p.description | quote }}
  sourceRepos:
    {{- toYaml $p.sourceRepos | nindent 4 }}
  destinations:
    - server: {{ .Values.destinationServer }}
      namespace: {{ .Values.argocdNamespace }}
  clusterResourceWhitelist: []
  namespaceResourceWhitelist:
    - { group: argoproj.io, kind: Application }
    - { group: argoproj.io, kind: ApplicationSet }
    - { group: argoproj.io, kind: AppProject }
    {{- if .Values.repoCreds }}
    - { group: external-secrets.io, kind: ExternalSecret }
    {{- end }}
    {{- if or .Values.repositories .Values.repoCreds }}
    - { group: "", kind: Secret }
    {{- end }}
